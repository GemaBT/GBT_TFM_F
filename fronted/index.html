<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>API Login Front</title>
</head>
<body>
    <h1>Login API</h1>

    <label for="apiSelect">Selecciona API:</label>
    <select id="apiSelect">
        <option value="fastapi">FastAPI</option>
        <option value="django">Django</option>
    </select>

    <form id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Login</button>
    </form>

    <button id="listUsersBtn">Listar Usuarios</button>
    <button id="changePasswordBtn">Cambiar Contraseña</button>

    <pre id="result"></pre>

<script>
const result = document.getElementById("result");
const apiSelect = document.getElementById("apiSelect");

// --- LOGIN ---
document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    let body;
    let url;

    if(apiSelect.value === "fastapi") {
        url = "http://localhost:8000/users/usuarios/login";
        body = JSON.stringify({username, password});
    } else { // django
        url = "http://127.0.0.1:8001/api/token/";
        body = JSON.stringify({username, password});
    }

    try {
        const res = await fetch(url, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);

        // Guardar token
        const token = data.access || data.token;
        if(token) localStorage.setItem("token", token);

    } catch(err) {
        result.textContent = "Error: " + err;
    }
});

// --- LISTAR USUARIOS ---
document.getElementById("listUsersBtn").addEventListener("click", async () => {
    const token = localStorage.getItem("token");
    if(!token) return alert("Primero haz login");

    let url = apiSelect.value === "fastapi" 
        ? "http://localhost:8000/users/usuarios" 
        : "http://127.0.0.1:8001/usuarios/";

    try {
        const res = await fetch(url, {
            headers: {
                "Authorization": apiSelect.value === "fastapi" 
                    ? `Bearer ${token}` 
                    : `Bearer ${token}`
            }
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
    } catch(err) {
        result.textContent = "Error: " + err;
    }
});

// --- CAMBIAR CONTRASEÑA ---
document.getElementById("changePasswordBtn").addEventListener("click", async () => {
    const old_password = prompt("Contraseña actual:");
    const new_password = prompt("Nueva contraseña:");
    const token = localStorage.getItem("token");
    if(!token) return alert("Primero haz login");

    let url, body;
    if(apiSelect.value === "fastapi") {
        url = "http://localhost:8000/users/usuarios/change-password";
        body = JSON.stringify({old_password, new_password});
    } else { // django
        alert("Django: Implementa endpoint de cambio de contraseña");
        return;
    }

    try {
        const res = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
    } catch(err) {
        result.textContent = "Error: " + err;
    }
});
</script>
</body>
</html>
