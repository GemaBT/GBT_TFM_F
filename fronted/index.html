<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>API Frontend</title>

    <style>
        body { font-family: Arial; max-width: 700px; margin: 20px auto; }
        input, select, button { margin: 5px 0; padding: 8px; width: 100%; }
        button { cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; }
        h2 { margin-top: 25px; }
    </style>
</head>

<body>

<h1>Frontend APIs (FastAPI vs Django)</h1>

<select id="apiSelect">
    <option value="fastapi">FastAPI</option>
    <option value="django">Django</option>
</select>

<!-- ================= LOGIN ================= -->
<h2>Login</h2>
<input type="text" id="username" placeholder="Usuario">
<input type="password" id="password" placeholder="Contraseña">
<button id="loginBtn">Login</button>

<!-- ================= REGISTRO ================= -->
<h2>Registro</h2>
<input type="text" id="regUsername" placeholder="Usuario">
<input type="email" id="regEmail" placeholder="Email">
<input type="password" id="regPassword" placeholder="Contraseña">

<select id="regRole">
    <option value="1">Admin</option>
    <option value="2" selected>Usuario</option>
</select>

<button id="registerBtn">Registrar</button>

<!-- ================= USUARIOS ================= -->
<h2>Usuarios</h2>
<button id="getUsersBtn">Listar usuarios</button>

<!-- ================= BUSCAR ID ================= -->
<h2>Buscar usuario por ID</h2>
<input type="number" id="userId" placeholder="ID usuario">
<button id="getUserBtn">Buscar usuario</button>

<!-- ================= PASSWORD ================= -->
<h2>Cambiar contraseña</h2>
<input type="number" id="passUserId" placeholder="ID usuario">
<input type="password" id="oldPassword" placeholder="Contraseña actual">
<input type="password" id="newPassword" placeholder="Nueva contraseña">
<button id="changePassBtn">Cambiar contraseña</button>

<h2>Resultado</h2>
<pre id="result"></pre>

<script>

const apiSelect = document.getElementById("apiSelect");
const result = document.getElementById("result");

/* ================= LOGIN ================= */
document.getElementById("loginBtn").addEventListener("click", async () => {

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    const username = usernameInput.value;
    const password = passwordInput.value;

    let url = apiSelect.value === "fastapi"
        ? "http://127.0.0.1:8000/api/token/"
        : "http://127.0.0.1:8001/api/token/";

    const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    result.textContent = JSON.stringify(data, null, 2);

    // 🔥 LIMPIAR CAMPOS LOGIN
    usernameInput.value = "";
    passwordInput.value = "";

    const token = data.access_token || data.access;
    if (token) localStorage.setItem("token", token);
});


/* ================= REGISTRO ================= */
document.getElementById("registerBtn").addEventListener("click", async () => {

    const usernameInput = document.getElementById("regUsername");
    const emailInput = document.getElementById("regEmail");
    const passwordInput = document.getElementById("regPassword");

    const username = usernameInput.value;
    const email = emailInput.value;
    const password = passwordInput.value;
    const role_id = parseInt(document.getElementById("regRole").value);

    let url, body;

    if (apiSelect.value === "fastapi") {
        url = "http://127.0.0.1:8000/api/registro/";
        body = { username, email, password, role_id };
    } else {
        url = "http://127.0.0.1:8001/api/registro/";
        body = {
            username,
            email,
            password,
            role: role_id === 1 ? "admin" : "user"
        };
    }

    const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });

    const data = await res.json();
    result.textContent = JSON.stringify(data, null, 2);

    // 🔥 LIMPIAR CAMPOS REGISTRO
    usernameInput.value = "";
    emailInput.value = "";
    passwordInput.value = "";
});


/* ================= LISTAR USUARIOS ================= */
document.getElementById("getUsersBtn").addEventListener("click", async () => {

    const token = localStorage.getItem("token");
    if (!token) return alert("Inicia sesión primero");

    let url = apiSelect.value === "fastapi"
        ? "http://127.0.0.1:8000/api/usuarios/"
        : "http://127.0.0.1:8001/api/usuarios/";

    const res = await fetch(url, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    const data = await res.json();
    result.textContent = JSON.stringify(data, null, 2);
});


/* ================= USUARIO POR ID ================= */
document.getElementById("getUserBtn").addEventListener("click", async () => {

    const token = localStorage.getItem("token");
    const idInput = document.getElementById("userId");

    const id = idInput.value;

    if (!token) return alert("Inicia sesión primero");

    let url = apiSelect.value === "fastapi"
        ? `http://127.0.0.1:8000/api/usuarios/${id}/`
        : `http://127.0.0.1:8001/api/usuarios/${id}/`;

    const res = await fetch(url, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    const data = await res.json();
    result.textContent = JSON.stringify(data, null, 2);

    // 🔥 limpiar campo
    idInput.value = "";
});


/* ================= CAMBIAR PASSWORD ================= */
document.getElementById("changePassBtn").addEventListener("click", async () => {

    const token = localStorage.getItem("token");

    const idInput = document.getElementById("passUserId");
    const oldPassInput = document.getElementById("oldPassword");
    const newPassInput = document.getElementById("newPassword");

    const user_id = idInput.value;
    const old_password = oldPassInput.value;
    const new_password = newPassInput.value;

    if (!token) return alert("Inicia sesión primero");

    let url = apiSelect.value === "fastapi"
        ? `http://127.0.0.1:8000/api/usuarios/${user_id}/password/`
        : `http://127.0.0.1:8001/api/usuarios/${user_id}/password/`;

    const res = await fetch(url, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ old_password, new_password })
    });

    const data = await res.json();
    result.textContent = JSON.stringify(data, null, 2);

    // 🔥 LIMPIAR CAMPOS PASSWORD
    idInput.value = "";
    oldPassInput.value = "";
    newPassInput.value = "";
});

</script>

</body>
</html>
