<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>API Frontend</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; }
        input, select, button { margin: 5px 0; padding: 5px; width: 100%; }
        pre { background: #f4f4f4; padding: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>API Frontend</h1>

    <h2>Selecciona API</h2>
    <select id="apiSelect">
        <option value="fastapi">FastAPI</option>
        <option value="django">Django</option>
    </select>

    <h2>Login</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Login</button>
    </form>

    <h2>Registrar Usuario</h2>
    <form id="registerForm">
        <input type="text" id="regUsername" placeholder="Usuario" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Contraseña" required>
        <button type="submit">Registrar</button>
    </form>

    <h2>Usuarios</h2>
    <button id="getUsersBtn">Listar Usuarios</button>

    <h2>Cambiar Contraseña</h2>
    <form id="changePasswordForm">
        <input type="password" id="oldPassword" placeholder="Contraseña antigua" required>
        <input type="password" id="newPassword" placeholder="Nueva contraseña" required>
        <button type="submit">Cambiar</button>
    </form>

    <h2>Resultado</h2>
    <pre id="result"></pre>

    <script>
        const apiSelect = document.getElementById("apiSelect");
        const result = document.getElementById("result");

        // Helper: obtener URL base según API
        function getApiUrl(path) {
            if (apiSelect.value === "fastapi") return `http://127.0.0.1:8001${path}`;
            return `http://127.0.0.1:8000${path}`;
        }

        // --- LOGIN ---
        document.getElementById("loginForm").addEventListener("submit", async e => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            let body;
            if(apiSelect.value === "fastapi") body = JSON.stringify({username, password});
            else body = JSON.stringify({username, password});

            try {
                const res = await fetch(getApiUrl(apiSelect.value === "fastapi" ? "/users/login" : "/token/"), {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body
                });
                const data = await res.json();
                result.textContent = JSON.stringify(data, null, 2);
                const token = data.access || data.token;
                if(token) localStorage.setItem("token", token);
            } catch(err) {
                result.textContent = "Error: " + err;
            }
        });

        // --- REGISTRO ---
        document.getElementById("registerForm").addEventListener("submit", async e => {
            e.preventDefault();
            const username = document.getElementById("regUsername").value;
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;

            const body = JSON.stringify({username, email, password});
            try {
                const res = await fetch(getApiUrl(apiSelect.value === "fastapi" ? "/users/usuarios" : "/usuarios/"), {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body
                });
                const data = await res.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch(err) {
                result.textContent = "Error: " + err;
            }
        });

        // --- LISTAR USUARIOS ---
        document.getElementById("getUsersBtn").addEventListener("click", async () => {
            const token = localStorage.getItem("token");
            if(!token) return alert("Inicia sesión primero");
            try {
                const res = await fetch(getApiUrl("/usuarios/"), {
                    headers: {"Authorization": `Bearer ${token}`}
                });
                const data = await res.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch(err) {
                result.textContent = "Error: " + err;
            }
        });

        // --- CAMBIAR CONTRASEÑA ---
        document.getElementById("changePasswordForm").addEventListener("submit", async e => {
            e.preventDefault();
            const token = localStorage.getItem("token");
            if(!token) return alert("Inicia sesión primero");

            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;

            try {
                const res = await fetch(getApiUrl("/usuarios/cambiar-password"), {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({old_password: oldPassword, new_password: newPassword})
                });
                const data = await res.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch(err) {
                result.textContent = "Error: " + err;
            }
        });
    </script>
</body>
</html>
